name: Tests and publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_publication.py --history
      - run: python scripts/check_locales.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python koreader-bridge.py --self-test
      - run: python kobo-koreader-migrate.py --version
      - run: python scripts/prepare_release.py prepare --ref HEAD
